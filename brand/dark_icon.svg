<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceff1"/><stop offset="1" stop-color="#b0bec5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbdefb"/><stop offset="1" stop-color="#64b5f6"/>
    </linearGradient>
  </defs>
  <!-- sun behind the top right corner -->
  <circle cx="206" cy="44" r="26" fill="#ffca28"/>
  <g stroke="#ffca28" stroke-width="7" stroke-linecap="round">
    <line x1="240.0" y1="44.0" x2="252.0" y2="44.0"/>
    <line x1="230.0" y1="68.0" x2="238.5" y2="76.5"/>
    <line x1="206.0" y1="78.0" x2="206.0" y2="90.0"/>
    <line x1="182.0" y1="68.0" x2="173.5" y2="76.5"/>
    <line x1="172.0" y1="44.0" x2="160.0" y2="44.0"/>
    <line x1="182.0" y1="20.0" x2="173.5" y2="11.5"/>
    <line x1="206.0" y1="10.0" x2="206.0" y2="-2.0"/>
    <line x1="230.0" y1="20.0" x2="238.5" y2="11.5"/>
  </g>
  <!-- window frame and glass -->
  <rect x="40" y="52" width="168" height="184" rx="10" fill="#37474f" stroke="#b0bec5" stroke-width="8"/>
  <rect x="56" y="70" width="136" height="150" fill="url(#glass)"/>
  <!-- shutter box -->
  <rect x="30" y="34" width="188" height="36" rx="8" fill="#455a64" stroke="#b0bec5" stroke-width="8"/>
  <!-- slats, half way down -->
  <g stroke="#90a4ae" stroke-width="3">
    <rect x="56" y="70" width="136" height="80" fill="url(#slat)" stroke="none"/>
    <line x1="56" y1="86" x2="192" y2="86"/><line x1="56" y1="102" x2="192" y2="102"/>
    <line x1="56" y1="118" x2="192" y2="118"/><line x1="56" y1="134" x2="192" y2="134"/>
  </g>
  <rect x="52" y="146" width="144" height="10" rx="3" fill="#546e7a"/>
  <!-- up/down arrows -->
  <g fill="#1e88e5">
    <polygon points="124,170 140,192 108,192"/>
    <polygon points="124,214 140,192 108,192" opacity="0.35"/>
  </g>
</svg>
