set_lock:
  target:
    device:
      integration: smart_shutter_control
      model: Shutter controller
  fields:
    mode:
      required: true
      selector:
        select:
          translation_key: lock_mode
          options:
            - none
            - hold
            - force_open
            - force_closed
    duration:
      required: false
      selector:
        duration:
