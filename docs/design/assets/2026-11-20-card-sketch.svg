<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceff1"/><stop offset="1" stop-color="#b0bec5"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset="1" stop-color="#90caf9"/></linearGradient>
  </defs>
  <rect width="900" height="360" rx="14" fill="#ffffff" stroke="#e0e0e0"/>
  <!-- left: one shutter card -->
  <text x="24" y="34" font-size="16" font-weight="600" fill="#212121">Living room</text>
  <rect x="372" y="18" width="104" height="24" rx="12" fill="#e8f5e9"/><text x="424" y="35" font-size="12" fill="#2e7d32" text-anchor="middle">Automatic</text>
  <g transform="translate(46 0)">
  <!-- window -->
  <rect x="40" y="70" width="190" height="230" rx="6" fill="#fafafa" stroke="#90a4ae" stroke-width="4"/>
  <rect x="52" y="84" width="166" height="206" fill="url(#glass)"/>
  <!-- guide rails -->
  <rect x="46" y="84" width="6" height="206" fill="#b0bec5"/><rect x="218" y="84" width="6" height="206" fill="#b0bec5"/>
  <!-- box -->
  <rect x="34" y="52" width="202" height="32" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/>
  <!-- slats to 62 % open (38 % covered) -->
  <rect x="52" y="84" width="166" height="78" fill="url(#slat)"/>
  <g stroke="#90a4ae" stroke-width="2"><line x1="52" y1="97" x2="218" y2="97"/><line x1="52" y1="110" x2="218" y2="110"/><line x1="52" y1="123" x2="218" y2="123"/><line x1="52" y1="136" x2="218" y2="136"/><line x1="52" y1="149" x2="218" y2="149"/></g>
  <!-- draggable bottom bar -->
  <rect x="48" y="158" width="174" height="12" rx="4" fill="#546e7a"/>
  <rect x="117" y="153" width="36" height="22" rx="11" fill="#1e88e5" stroke="#ffffff" stroke-width="2"/>
  <g stroke="#ffffff" stroke-width="2"><line x1="127" y1="161" x2="143" y2="161"/><line x1="127" y1="167" x2="143" y2="167"/></g>
  <!-- maximum position mark (80 %) -->
  <line x1="14" y1="125" x2="30" y2="125" stroke="#ef6c00" stroke-width="3"/><text x="30" y="141" font-size="11" fill="#ef6c00" text-anchor="end">max 80 %</text>
  </g>
  <!-- buttons -->
  <g font-size="22" text-anchor="middle" fill="#212121">
    <circle cx="316" cy="110" r="22" fill="#eceff1"/><text x="316" y="118">↑</text>
    <circle cx="316" cy="170" r="22" fill="#eceff1"/><rect x="308" y="162" width="16" height="16" fill="#212121"/>
    <circle cx="316" cy="230" r="22" fill="#eceff1"/><text x="316" y="238">↓</text>
  </g>
  <!-- status -->
  <text x="372" y="104" font-size="26" font-weight="700" fill="#1e88e5">62 %</text>
  <text x="372" y="124" font-size="12" fill="#757575">open</text>
  <text x="372" y="160" font-size="13" fill="#212121">☀ Sun on the window</text>
  <text x="372" y="180" font-size="12" fill="#757575">shading 30 % · day</text>
  <text x="372" y="214" font-size="13" fill="#212121">Next: 16:55 dusk 35 %</text>
  <text x="372" y="234" font-size="12" fill="#757575">then 17:10 closed</text>
  <!-- switches -->
  <g font-size="13" fill="#212121">
    <rect x="86" y="318" width="34" height="18" rx="9" fill="#43a047"/><circle cx="111" cy="327" r="7" fill="#fff"/><text x="128" y="332">Automatic</text>
    <rect x="226" y="318" width="34" height="18" rx="9" fill="#bdbdbd"/><circle cx="235" cy="327" r="7" fill="#fff"/><text x="268" y="332">Sleep in</text>
  </g>
  <!-- right: all shutters, compact -->
  <line x1="545" y1="18" x2="545" y2="342" stroke="#e0e0e0"/>
  <text x="562" y="34" font-size="16" font-weight="600" fill="#212121">All shutters</text>
  <g font-size="12" fill="#212121">
    <g transform="translate(562 52)">
      <rect width="72" height="88" rx="4" fill="url(#glass)" stroke="#90a4ae" stroke-width="2"/><rect width="72" height="34" fill="url(#slat)"/><rect y="32" width="72" height="5" fill="#546e7a"/>
      <text x="82" y="20" font-weight="600">Living room</text><text x="82" y="38" fill="#757575">62 % · sun</text><text x="82" y="56" fill="#757575">↑ ■ ↓</text>
    </g>
    <g transform="translate(562 154)">
      <rect width="72" height="88" rx="4" fill="url(#glass)" stroke="#90a4ae" stroke-width="2"/><rect width="72" height="88" fill="url(#slat)"/><rect y="84" width="72" height="5" fill="#546e7a"/>
      <text x="82" y="20" font-weight="600">Kitchen</text><text x="82" y="38" fill="#757575">closed · sleep in</text><text x="82" y="56" fill="#757575">↑ ■ ↓</text>
    </g>
    <g transform="translate(562 256)">
      <rect width="72" height="88" rx="4" fill="url(#glass)" stroke="#90a4ae" stroke-width="2"/><rect width="72" height="10" fill="url(#slat)"/><rect y="8" width="72" height="5" fill="#546e7a"/>
      <text x="82" y="20" font-weight="600">Bedroom</text><text x="82" y="38" fill="#e65100">manual · until 16:55</text><text x="82" y="56" fill="#757575">↑ ■ ↓</text>
    </g>
  </g>
  <rect x="692" y="18" width="196" height="24" rx="12" fill="#fff3e0"/><text x="790" y="35" font-size="12" fill="#e65100" text-anchor="middle">⚠ Storm: only open/closed</text>
</svg>
