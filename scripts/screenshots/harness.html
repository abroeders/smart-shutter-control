<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
    --card-background-color: #ffffff; --secondary-background-color: #e5e5e5; --divider-color: #e0e0e0;
    --success-color: #43a047; --warning-color: #ffa600; --error-color: #db4437; --info-color: #039be5;
    --disabled-color: #bdbdbd;
  }
  :root.dark {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c;
    --secondary-background-color: #282828; --divider-color: rgba(225, 225, 225, 0.12); --disabled-color: #6f6f6f;
  }
  body { margin: 0; padding: 16px; background: #fafafa; font-family: Roboto, "DejaVu Sans", sans-serif; }
  :root.dark body { background: #111111; }
  #host { width: var(--width, 520px); }
</style>
<script>
  // Minimal ha-card: a rounded surface.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        "<style>:host{display:block;background:var(--card-background-color);color:var(--primary-text-color);" +
        "border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.12);border:1px solid var(--divider-color)}</style><slot></slot>";
    }
  });
</script>
</head>
<body>
<div id="host"></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const dark = params.get("theme") === "dark";
  if (dark) document.documentElement.classList.add("dark");
  document.documentElement.style.setProperty("--width", `${params.get("width") || 520}px`);
  await import("/custom_components/smart_shutter_control/frontend/smart-shutter-card.js");
  const hass = await (await fetch("/scripts/screenshots/hass.json")).json();
  hass.callService = async () => {};
  hass.themes = { darkMode: dark };
  const card = document.createElement("smart-shutter-card");
  card.setConfig({ type: "custom:smart-shutter-card", device_id: params.get("device"), language: params.get("lang") || undefined });
  card.hass = hass;
  document.getElementById("host").appendChild(card);
  await card.updateComplete;
  await new Promise((r) => setTimeout(r, 100));
  window.__ready = true;
</script>
</body>
</html>
