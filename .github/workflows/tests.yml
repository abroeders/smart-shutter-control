name: Tests

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests  # the pure Python core, without Home Assistant

  home-assistant:  # on the minimum version from hacs.json and on the latest version (#88)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"  # the test plugin for 2026.3 and later needs Python 3.14
      - name: Install Home Assistant
        run: |
          if [ "${{ matrix.ha }}" = minimum ]; then
            minimum=$(python -c "import json; print(json.load(open('hacs.json'))['homeassistant'])")
            pip install pytest-homeassistant-custom-component pytest-cov "homeassistant~=${minimum%.*}.0"
          else
            pip install pytest-homeassistant-custom-component pytest-cov
          fi
          pip show homeassistant | grep ^Version
      # both test folders in one run; fails below the minimum coverage in pyproject.toml (#99)
      - run: pytest -p no:cacheprovider --cov
      - name: Type check (mypy) against the minimum version (#92)
        if: matrix.ha == 'minimum'
        run: |
          pip install mypy==2.4.1
          mypy

  docs:  # the documentation site builds without broken links (#78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
      - run: npm install --no-save --ignore-scripts mermaid@11 jsdom@24
      - run: node scripts/check_mermaid.mjs docs/*.md docs/design/*.md

  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:size
      - name: The committed bundle matches the source
        run: git diff --exit-code -- ../custom_components/smart_shutter_control/frontend/
