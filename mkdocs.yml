# Documentation site on GitHub Pages (#78), built from docs/ by .github/workflows/docs.yml
site_name: Smart Shutter Control
site_description: Home Assistant integration that controls roller shutters
site_url: https://abroeders.github.io/smart-shutter-control/
repo_url: https://github.com/abroeders/smart-shutter-control
repo_name: abroeders/smart-shutter-control
edit_uri: edit/develop/docs/

docs_dir: docs
exclude_docs: |
  design/
  hooks.py
  __pycache__/
hooks:
  - docs/hooks.py

nav:
  - Home: README.md
  - Getting started:
      - Installation: installation.md
      - Configuration: configuration.md
      - Calibration: calibration.md
  - Using it:
      - Entities: entities.md
      - The card: card.md
      - How it works: how-it-works.md
      - FAQ and troubleshooting: faq.md
  - Developers:
      - Architecture: architecture.md

theme:
  name: material
  logo: assets/icon.svg  # brand/icon.svg, added by docs/hooks.py (#81)
  favicon: assets/icon.svg
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light theme

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    unrecognized_links: warn
